<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-gradient-start: #667eea;
            --bg-gradient-end: #764ba2;
            --container-bg: #ffffff;
            --text-primary: #333333;
            --text-secondary: #666666;
            --border-color: #e0e0e0;
            --input-bg: #ffffff;
            --input-border: #e0e0e0;
            --input-focus: #667eea;
            --btn-primary: #667eea;
            --btn-primary-hover: #5568d3;
            --stats-bg: #f8f9fa;
            --task-hover-shadow: rgba(102, 126, 234, 0.2);
            --badge-todo-bg: #e0e0e0;
            --badge-todo-text: #666666;
        }

        [data-theme="dark"] {
            --bg-gradient-start: #1a1a2e;
            --bg-gradient-end: #16213e;
            --container-bg: #0f3460;
            --text-primary: #e4e4e4;
            --text-secondary: #b0b0b0;
            --border-color: #2d4059;
            --input-bg: #1a1a2e;
            --input-border: #2d4059;
            --input-focus: #00adb5;
            --btn-primary: #00adb5;
            --btn-primary-hover: #00909a;
            --stats-bg: #1a1a2e;
            --task-hover-shadow: rgba(0, 173, 181, 0.3);
            --badge-todo-bg: #2d4059;
            --badge-todo-text: #b0b0b0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            min-height: 100vh;
            padding: 20px;
            transition: background 0.3s ease;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--container-bg);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            transition: background 0.3s ease;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h1 {
            color: var(--btn-primary);
            font-size: 2rem;
            transition: color 0.3s ease;
        }

        .theme-toggle {
            background: var(--stats-bg);
            border: 2px solid var(--border-color);
            border-radius: 50px;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .theme-toggle:hover {
            transform: scale(1.05);
            border-color: var(--btn-primary);
        }

        .theme-toggle span {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            padding: 15px;
            background: var(--stats-bg);
            border-radius: 8px;
            transition: background 0.3s ease;
        }

        .stats span {
            color: var(--text-secondary);
            font-size: 0.9rem;
            transition: color 0.3s ease;
        }

        .stats strong {
            color: var(--text-primary);
            font-size: 1.2rem;
            margin-left: 5px;
            transition: color 0.3s ease;
        }

        #taskForm {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 30px;
        }

        #titleInput {
            padding: 12px;
            border: 2px solid var(--input-border);
            border-radius: 6px;
            font-size: 1rem;
            background: var(--input-bg);
            color: var(--text-primary);
            transition: all 0.3s ease;
        }

        #titleInput:focus {
            outline: none;
            border-color: var(--input-focus);
        }

        #noteInput {
            padding: 12px;
            border: 2px solid var(--input-border);
            border-radius: 6px;
            font-size: 0.9rem;
            resize: vertical;
            min-height: 60px;
            font-family: inherit;
            background: var(--input-bg);
            color: var(--text-primary);
            transition: all 0.3s ease;
        }

        #noteInput:focus {
            outline: none;
            border-color: var(--input-focus);
        }

        #taskForm button[type="submit"] {
            padding: 12px;
            background: var(--btn-primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        #taskForm button[type="submit"]:hover {
            background: var(--btn-primary-hover);
        }

        #taskList {
            list-style: none;
        }

        .task {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 10px;
            transition: all 0.3s ease;
            background: var(--container-bg);
        }

        .task:hover {
            border-color: var(--btn-primary);
            box-shadow: 0 2px 8px var(--task-hover-shadow);
        }

        .task.done {
            opacity: 0.6;
            border-color: #28a745;
        }

        [data-theme="dark"] .task.done {
            background: rgba(40, 167, 69, 0.1);
        }

        [data-theme="light"] .task.done {
            background: #f0fff4;
        }

        .task.progress {
            border-color: #ffc107;
        }

        [data-theme="dark"] .task.progress {
            background: rgba(255, 193, 7, 0.1);
        }

        [data-theme="light"] .task.progress {
            background: #fffbf0;
        }

        .left {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .title {
            font-size: 1rem;
            color: var(--text-primary);
            position: relative;
            cursor: help;
            transition: color 0.3s ease;
        }

        .title[data-note]:hover::after {
            content: attr(data-note);
            position: absolute;
            bottom: 100%;
            left: 0;
            background: #333;
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            white-space: pre-wrap;
            max-width: 300px;
            z-index: 10;
            margin-bottom: 5px;
        }

        [data-theme="dark"] .title[data-note]:hover::after {
            background: #1a1a2e;
            border: 1px solid var(--border-color);
        }

        .badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .task.todo .badge {
            background: var(--badge-todo-bg);
            color: var(--badge-todo-text);
        }

        .task.progress .badge {
            background: #fff3cd;
            color: #856404;
        }

        [data-theme="dark"] .task.progress .badge {
            background: rgba(255, 193, 7, 0.3);
            color: #ffc107;
        }

        .task.done .badge {
            background: #d4edda;
            color: #155724;
        }

        [data-theme="dark"] .task.done .badge {
            background: rgba(40, 167, 69, 0.3);
            color: #28a745;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .btn {
            padding: 8px 12px;
            background: var(--stats-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1rem;
            color: var(--text-primary);
        }

        .btn:hover {
            background: var(--input-bg);
            transform: translateY(-1px);
            border-color: var(--btn-primary);
        }

        .btn.danger {
            color: #dc3545;
        }

        .btn.danger:hover {
            background: rgba(220, 53, 69, 0.1);
            border-color: #dc3545;
        }

        .empty {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
            transition: color 0.3s ease;
        }

        .empty strong {
            display: block;
            font-size: 1.2rem;
            margin-bottom: 10px;
            color: var(--text-primary);
            transition: color 0.3s ease;
        }

        .empty span {
            font-size: 0.9rem;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.5rem;
            }

            .header {
                flex-direction: column;
                gap: 15px;
                align-items: flex-start;
            }

            .stats {
                flex-direction: column;
                gap: 10px;
            }

            .task {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            .actions {
                width: 100%;
                justify-content: flex-end;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📋 TaskFlow</h1>
            <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
                <span id="themeIcon">🌙</span>
                <span id="themeText">Dark</span>
            </button>
        </div>
        
        <div class="stats">
            <span>✅ Done: <strong id="doneCount">0</strong></span>
            <span>🔄 In Progress: <strong id="progressCount">0</strong></span>
            <span>📊 Total: <strong id="totalCount">0</strong></span>
        </div>

        <form id="taskForm">
            <input type="text" id="titleInput" placeholder="What needs to be done?" required>
            <textarea id="noteInput" placeholder="Add notes (optional)"></textarea>
            <button type="submit">Add Task</button>
        </form>

        <ul id="taskList"></ul>
    </div>

    <script>
        // Dark mode toggle
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const themeText = document.getElementById('themeText');
        const htmlElement = document.documentElement;

        // Check for saved theme preference or default to 'light'
        const currentTheme = localStorage.getItem('theme') || 'light';
        htmlElement.setAttribute('data-theme', currentTheme);
        updateThemeButton(currentTheme);

        themeToggle.addEventListener('click', () => {
            const currentTheme = htmlElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            
            htmlElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeButton(newTheme);
        });

        function updateThemeButton(theme) {
            if (theme === 'dark') {
                themeIcon.textContent = '☀️';
                themeText.textContent = 'Light';
            } else {
                themeIcon.textContent = '🌙';
                themeText.textContent = 'Dark';
            }
        }
    </script>
    <script src="app.js"></script>
</body>
</html>
