<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <h1>TaskFlow</h1>

    <form id="taskForm">
      <input
        type="text"
        id="titleInput"
        placeholder="New task..."
        required
      />
      <button type="submit">Add</button>
    </form>

    <ul id="taskList"></ul>
  </div>

  <script src="app.js"></script>
</body>
</html>
